<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image" href="img/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <!-- Google Consent Mode v2: значения по умолчанию до загрузки GTM -->
    <script>
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { window.dataLayer.push(arguments); };
      window.gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        wait_for_update: 500
      });
      // Восстанавливаем согласие из прошлого визита
      try {
        if (localStorage.getItem('cookie-consent') === 'accepted') {
          window.gtag('consent', 'update', {
            ad_storage: 'granted',
            ad_user_data: 'granted',
            ad_personalization: 'granted',
            analytics_storage: 'granted'
          });
        }
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300..900&display=swap">
    <style>
      * {
  margin: 0;
  padding: 0;
  border: 0;
  outline: 0;
  font-weight: inherit;
  font-style: inherit;
  font-family: inherit;
  font-size: 100%;
  vertical-align: baseline;
}

body {
  line-height: 1;
  background: #000000;
  font-family: 'JetBrains Mono', monospace;
  line-height: 130%;

  overflow-x: hidden;
}

}

  border-collapse: separate;
  border-spacing: 0;
}

caption,
table,

  vertical-align: middle;
  text-align: left;
  font-weight: 400;
}

a img div {

}



a {

}

body {

}
